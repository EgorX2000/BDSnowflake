services:
  db:
    image: postgres:16-alpine
    container_name: snowflake_db
    environment:
      POSTGRES_DB: snowflake
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5445:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./исходные данные:/data
      - ./sql/init:/docker-entrypoint-initdb.d

volumes:
  postgres_data: